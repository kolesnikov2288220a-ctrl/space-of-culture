<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>№ 2 · 67 — Space of Culture</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --text-color: #1a1a1a;
            --meta-color: #7a2b2b;
            --border-color: #1a1a1a;
            --font-serif: Georgia, "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            max-width: 820px;
            margin: 80px auto;
            padding: 0 40px;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, #fbfaf7 0%, var(--bg-color) 80%);
            color: var(--text-color);
            font-family: var(--font-serif);
            line-height: 1.6;
            overflow-wrap: break-word;
            word-wrap: break-word;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.22;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 50px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .university-badge {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--meta-color);
            border: 1px solid var(--meta-color);
            padding: 2px 7px;
            border-radius: 2px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title {
            font-family: var(--font-sans);
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .header-issue {
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--meta-color);
            margin-top: 4px;
        }

        .header-right {
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: right;
            color: #666;
        }

        .category-title {
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
            margin-top: 45px;
            margin-bottom: 25px;
            color: var(--meta-color);
        }

        .article-item {
            margin-bottom: 30px;
        }

        .author {
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 4px;
        }

        .article-title a {
            position: relative;
            display: inline-block;
            font-size: 20px;
            color: var(--text-color);
            text-decoration: none;
            padding-bottom: 2px;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
        }

        .article-title a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--text-color);
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .article-title a:hover {
            transform: translateX(4px);
            color: var(--meta-color);
        }

        .article-title a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
            background-color: var(--meta-color);
        }

        .back-nav {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .back-nav a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-nav a:hover {
            color: var(--meta-color);
        }

        @media (max-width: 600px) {
            body {
                margin: 30px auto;
                padding: 0 18px;
                font-size: 16px;
            }
            header {
                padding-bottom: 18px;
                margin-bottom: 35px;
            }
            .header-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-right {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <span class="university-badge">Spatium Culturae /// Ala-Too International University</span>
        </div>
        <div class="header-main">
            <div>
                <div class="header-title">Space of Culture</div>
                <div class="header-issue">№ 2 · 67</div>
            </div>
            <div class="header-right">
                Содержание<br>Table of Contents
            </div>
        </div>
    </header>

    <main>

        <div class="category-title">Статьи / Articles</div>

        <!-- Позже сюда добавятся ваши статьи -->

        <div class="back-nav">
            <a href="../index.html">← Назад к архиву / Back to Archive</a>
        </div>

    </main>

</body>
</html>
