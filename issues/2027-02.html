<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>№ 2 · 67 — Space of Culture</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --text-color: #1a1a1a;
            --meta-color: #7a2b2b;
            --border-color: #1a1a1a;
            --font-serif: Georgia, "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            max-width: 820px;
            margin: 80px auto;
            padding: 0 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-serif);
            line-height: 1.6;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 50px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .university-badge {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--meta-color);
            border: 1px solid var(--meta-color);
            padding: 2px 7px;
            border-radius: 2px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title {
            font-family: var(--font-sans);
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .header-issue {
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--meta-color);
            margin-top: 4px;
        }

        .header-right {
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: right;
            color: #666;
        }

        .category-title {
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            border-bottom: 1px solid #ccc;
            padding-bottom: 6px;
            margin-top: 45px;
            margin-bottom: 25px;
            color: var(--meta-color);
        }

        .article-item {
            margin-bottom: 30px;
        }

        .author {
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 4px;
        }

        .article-title a {
            font-size: 20px;
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .article-title a:hover {
            border-bottom-color: var(--text-color);
        }

        .back-nav {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .back-nav a {
            color: var(--text-color);
            text-decoration: none;
        }

        .back-nav a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                margin: 30px auto;
                padding: 0 18px;
                font-size: 16px;
            }
            header {
                padding-bottom: 18px;
                margin-bottom: 35px;
            }
            .header-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-right {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <span class="university-badge">Spatium Culturae /// Academia</span>
        </div>
        <div class="header-main">
            <div>
                <div class="header-title">Space of Culture</div>
                <div class="header-issue">№ 2 · 67</div>
            </div>
            <div class="header-right">
                Содержание<br>Table of Contents
            </div>
        </div>
    </header>

    <main>

        <div class="category-title">Статьи / Articles</div>

        <!-- Сюда вставляются реальные статьи выпуска -->

        <div class="back-nav">
            <a href="../index.html">← Назад к архиву / Back to Archive</a>
        </div>

    </main>

</body>
</html>
