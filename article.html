<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space of Culture</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --text-color: #1a1a1a;
            --meta-color: #7a2b2b;
            --border-color: #1a1a1a;
            --font-serif: Georgia, "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            max-width: 820px;
            margin: 80px auto;
            padding: 0 40px;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, #fbfaf7 0%, var(--bg-color) 80%);
            color: var(--text-color);
            font-family: var(--font-serif);
            line-height: 1.6;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            opacity: 0.22;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
        }

        header a:hover {
            color: var(--meta-color);
        }

        .article-issue {
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--meta-color);
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-size: 34px;
            font-weight: normal;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .article-author {
            font-family: var(--font-sans);
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 30px 0;
        }

        .article-body {
            font-size: 18px;
        }
        
        .article-body p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <a href="issue-0.html">← К выпуску / Back to Issue</a>
    </header>

    <main>
        <span id="article-issue" class="article-issue"></span>
        <h1 id="article-title">Загрузка...</h1>
        <p id="article-author" class="article-author"></p>
        <hr>
        <div id="article-body" class="article-body"></div>
    </main>

    <script src="articles.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');
        const article = articlesData[articleId];

        if (article) {
            document.getElementById('article-issue').innerText = article.issue;
            document.getElementById('article-title').innerText = article.title;
            document.getElementById('article-author').innerText = "Authors: " + article.author;
            document.getElementById('article-body').innerHTML = article.content;
            document.title = article.title + " — Space of Culture";
        } else {
            document.getElementById('article-title').innerText = "Статья не найдена";
            document.getElementById('article-body').innerHTML = "<p>Запрашиваемый материал не существует.</p>";
        }
    </script>

</body>
</html>
